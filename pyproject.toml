[project]
name = "ai-companion-robot"
version = "0.1.0"
description = "AI 陪伴桌面机器人（代号：小伴）"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]
# 端侧向量检索（技术方案 §6.1）：ONNX Runtime 跑量化 bge-small-zh
local-embed = ["onnxruntime>=1.20", "tokenizers>=0.20"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
